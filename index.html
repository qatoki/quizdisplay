<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>問題表示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">

<style>
:root{
  --font:'BIZ UDGothic','BIZ UDゴシック','BIZ UDPGothic',sans-serif;
  --bg:#f4f5f7; --panel:#fff; --ink:#1d2330; --sub:#5b6475; --line:#dde1e8;
  --accent:#1f5fd1; --accent-soft:#e7efff; --ok:#1b8a4b; --warn:#c2410c; --ans:#b45309;
  --field:#fff; --soft:#f5f6f8; --rowline:#f0f1f4;
}
body.dark{
  --bg:#12151b; --panel:#1b2029; --ink:#e7eaf0; --sub:#9aa3b3; --line:#323a48;
  --accent:#4b86f0; --accent-soft:#1f2e4a; --ok:#3fbf75; --warn:#f08a5d; --ans:#f5b950;
  --field:#11151c; --soft:#232a35; --rowline:#262d39;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:var(--font);font-size:15px}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px}
button:hover{border-color:#b9c0cc}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.primary:hover{filter:brightness(1.08)}
button.ghost{background:transparent;border-color:transparent;color:var(--sub)}
button.danger{color:var(--warn)}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=url],textarea,select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--field);color:var(--ink);width:100%}
textarea{resize:vertical}
label.chk{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.hidden{display:none!important}
.muted{color:var(--sub)}
.small{font-size:13px}
.qtext{white-space:pre-wrap;word-break:break-word;line-break:strict}
ruby rt{font-size:.5em;font-weight:400}
.ann{border-radius:3px;white-space:nowrap}
.ann.has-link{text-decoration:underline dotted 2px;text-underline-offset:.28em}

/* ---------- 操作画面 ---------- */
#op{display:grid;grid-template-rows:auto 1fr;height:100vh}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar h1{font-size:17px;margin:0 8px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32vw}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--sub);white-space:nowrap}
.pill.on{background:#e3f5ea;color:#1b8a4b}
.pill.off{background:#fdeee6;color:#c2410c}
body.dark .pill.on{background:#173a27;color:#6fdc9d}
body.dark .pill.off{background:#45261a;color:#f6a27e}
.spacer{flex:1}
.opmain{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.next{display:flex;flex-direction:column;min-height:0}
.next .head{display:flex;align-items:baseline;gap:12px;padding:14px 20px 0}
.next .label{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.05em}
.next .no{font-size:22px;font-weight:700}
.next .body{padding:10px 20px 16px;overflow:auto;flex:1}
#nextQ{font-size:var(--opsize,30px);line-height:1.9;cursor:text}
#nextQ .seg:hover{background:none}
.ansrow{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);font-size:22px;line-height:1.8}
.ansrow .k{font-size:13px;color:var(--sub);margin-right:8px;font-weight:700}
.ansrow .a{color:var(--ans);font-weight:700}
.meta{font-size:14px;color:var(--sub);margin-top:8px;white-space:pre-wrap}
.hint{font-size:12px;color:var(--sub);padding:0 20px 8px}
.ctrl{display:flex;gap:10px;padding:12px 20px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.ctrl .big{font-size:18px;padding:12px 26px}
.side{display:flex;flex-direction:column;gap:16px;min-height:0}
.nowcard{padding:14px 16px}
.nowcard .label{font-size:13px;font-weight:700;color:var(--ok)}
.nowcard .q{font-size:15px;line-height:1.7;margin-top:6px;max-height:7.5em;overflow:auto}
.nowcard .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.list{display:flex;flex-direction:column}
.list .lh{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.list .lh b{font-size:14px}
.list ul{list-style:none;margin:0;padding:0;overflow:auto;height:calc(5 * 58px)}
.list li{display:grid;grid-template-columns:44px 1fr;gap:6px;padding:8px 12px;border-bottom:1px solid var(--rowline);cursor:pointer;font-size:13px;line-height:1.5;height:58px;align-items:center}
.list li:hover{background:var(--soft)}
.list li.none{display:block;height:auto;color:var(--sub);cursor:default;text-align:center;padding:24px}
.list .jump{margin-left:auto;display:flex;gap:6px;align-items:center}
.list .jump input{width:72px;padding:4px 8px;font-size:13px}
.list .jump button{padding:4px 10px;font-size:13px}
.list li .n{color:var(--sub);text-align:right;font-weight:700}
.list li .t{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.list li.latest{background:var(--accent-soft)}
.list li.shown{box-shadow:inset 3px 0 0 var(--ok)}
.empty{padding:40px;text-align:center;color:var(--sub);line-height:2}

/* モーダル */
.modal-bg{position:fixed;inset:0;background:rgba(20,25,35,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:5vh 16px;overflow:auto}
.modal{background:var(--panel);border-radius:14px;width:min(900px,100%);padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.sm{width:min(520px,100%)}
.modal h2{font-size:18px;margin:0 0 14px}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.field{margin-bottom:12px}
.field>.lab{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.maprow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.maprow .lab{font-size:12px}
table.prev{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.prev th,table.prev td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
table.prev th{background:var(--soft);white-space:nowrap}
.prevwrap{max-height:240px;overflow:auto}
.target{font-size:24px;padding:10px 14px;background:var(--soft);border-radius:8px;margin-bottom:12px;font-weight:700;word-break:break-all}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.quick a{font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:99px;text-decoration:none;color:var(--accent);background:var(--panel)}
.quick a:hover{background:var(--accent-soft)}
.quick.cand a{font-size:16px;font-weight:700;color:var(--ink)}
.quick.cand{min-height:34px}
.annpop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:10px 12px;font-size:14px;max-width:340px}
.annpop a{color:var(--accent);word-break:break-all}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qrbox svg{width:150px;height:150px;background:#fff}
.urlline{font-size:12px;word-break:break-all;color:var(--sub)}
.btnlink{display:block;text-align:center;background:var(--accent);color:#fff;border-radius:8px;padding:12px;font-weight:700;text-decoration:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1d2330;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ---------- 投影画面 ---------- */
#screen{position:fixed;inset:0;display:grid;grid-template-columns:13vw minmax(0,1fr);gap:1.2vw;padding:2.6vh 3vw 2.6vh 0;background:#000;color:#fff;overflow:hidden}
#screen.light{background:#fff;color:#111}
.num-font{font-family:'Oswald','BIZ UDGothic',sans-serif}
.sc-left{position:relative;display:flex;flex-direction:column;align-items:center;min-height:0}
.sc-nolab{position:absolute;left:.5vw;top:-1.6vh;font-size:2vh;font-weight:600;color:#ffc000}
.sc-no{font-size:14vh;font-weight:600;line-height:1.05;color:#ffc000;margin-top:1.5vh;letter-spacing:.01em;white-space:nowrap}
.sc-setlab{font-size:2.9vh;margin-top:5vh}
.sc-set{font-size:2.9vh;margin-top:2.6vh;text-align:center;line-height:1.5;padding:0 .6vw;word-break:break-all}
.sc-right{display:grid;grid-template-rows:47fr 23fr 24fr;gap:.6vh;min-height:0}
.sc-panel{background:#111;min-height:0;overflow:hidden;padding:.6vh .55vw}
#screen.light .sc-panel{background:#f1f2f4}
.sc-panel .inner{line-height:1.42}
#scQin{font-size:5.6vh;line-height:1.6}
.sc-ansp .inner{color:#ffff00;font-weight:700}
#screen.light .sc-ansp .inner{color:#b45309}
.sc-ansp .lab{font-size:.92em;font-weight:600;margin-right:.45em}
.sc-altp .inner{color:#f4a582;font-weight:700}
#screen.light .sc-altp .inner{color:#c2410c}
#screen ruby rt{font-size:.42em}
.sc-wait{opacity:.5}
.sc-qr{margin-top:auto;background:#fff;border-radius:1vh;padding:.8vh;text-align:center;color:#111;font-size:1.6vh;font-weight:700}
.sc-qr svg{width:10.5vw;height:10.5vw;max-width:17vh;max-height:17vh;display:block}
.sc-hint{position:absolute;left:1vw;bottom:1vh;font-size:12px;opacity:.35}

/* ---------- スマホ画面 ---------- */
#mobile{max-width:720px;margin:0 auto;padding:12px 12px 80px}
.m-head{display:flex;align-items:center;gap:8px;padding:6px 4px 12px}
.m-head h1{font-size:17px;margin:0;flex:1;line-height:1.4}
.m-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.m-card.latest{border:2px solid var(--accent)}
.m-card .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.m-card .no{font-weight:700;font-size:15px}
.m-card .tag{font-size:11px;background:var(--accent);color:#fff;border-radius:99px;padding:2px 8px}
.m-card .q{font-size:17px;line-height:1.9}
.m-card.latest .q{font-size:19px}
.m-card .a{margin-top:10px;font-size:17px;color:var(--ans);font-weight:700;line-height:1.7}
.m-card .a .k{font-size:12px;color:var(--sub);font-weight:400;margin-right:6px}
.m-card .alt{font-size:13px;color:var(--sub);margin-top:2px}
.m-card .note{font-size:12px;color:var(--sub);margin-top:6px;white-space:pre-wrap}
.m-card .save{margin-top:12px;display:flex;gap:8px;align-items:center}
.m-card .save button{flex:1;padding:11px}
.m-card .save button.done{background:#e3f5ea;border-color:#bfe5cd;color:var(--ok);font-weight:700}
.m-sec{font-size:13px;color:var(--sub);font-weight:700;margin:20px 4px 8px}
.linkmark{font-size:.7em;vertical-align:super;margin-left:1px;text-decoration:none}
.m-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.m-bar button{flex:1;max-width:340px}

@media (max-width:900px){
  .opmain{grid-template-columns:1fr}
  .side{min-height:400px}
  .maprow{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ======================= 操作画面 ======================= -->
<div id="op" class="hidden">
  <div class="topbar">
    <h1 id="opTitle">問題表示</h1>
    <span class="pill" id="opRoom">ルーム</span>
    <span class="pill" id="opConn">接続中…</span>
    <span class="spacer"></span>
    <button id="btnPaste">問題を貼り付け</button>
    <button id="btnShare">スマホ用QR</button>
    <button id="btnDark" title="ダークモード切替">🌙</button>
    <button id="btnSettings">設定</button>
    <button class="primary" id="btnOpenScreen">投影画面を開く</button>
  </div>
  <div class="opmain">
    <div class="card next">
      <div class="head"><span class="label">次に読む問題</span><span class="no" id="nextNo"></span><span class="spacer"></span><span class="muted small" id="progress"></span></div>
      <div class="body" id="nextBody"></div>
      <div class="hint">読めない漢字・英語は、その部分をクリック（または範囲をドラッグ）すると、ルビや参考リンクを付けられます。</div>
      <div class="ctrl">
        <button id="btnPrev" title="←">◀ 前の問題</button>
        <button class="primary big" id="btnRead" title="Enter">読了 → 投影 ⏎</button>
        <button id="btnSkip" title="→">次の問題 ▶</button>
        <span class="spacer"></span>
        <span style="display:flex;flex-direction:column;gap:4px">
          <label class="chk small"><input type="checkbox" id="chkEnter"> Enter キーで問題を進める</label>
          <label class="chk small"><input type="checkbox" id="chkAutoAns"> 読了時に答えも投影</label>
        </span>
      </div>
    </div>
    <div class="side">
      <div class="card nowcard">
        <div class="label" id="nowLabel">投影中：なし</div>
        <div class="q" id="nowQ"></div>
        <div class="row">
          <button id="btnToggleAns" title="A">答えを表示 (A)</button>
          <button id="btnClear">投影を消す</button>
        </div>
      </div>
      <div class="card list">
        <div class="lh"><b>読んだ問題</b><span class="muted small">新しい順</span><span class="jump"><input type="text" id="jumpNo" placeholder="No." inputmode="numeric"><button id="btnJump">へ移動</button></span></div>
        <ul id="qlist"></ul>
      </div>
    </div>
  </div>
</div>

<!-- ======================= 投影画面 ======================= -->
<div id="screen" class="hidden">
  <div class="sc-left">
    <div class="sc-nolab num-font">No.</div>
    <div class="sc-no num-font" id="scNo"></div>
    <div class="sc-setlab">問題集</div>
    <div class="sc-set" id="scSet"></div>
    <div class="sc-qr hidden" id="scQr"><div id="scQrSvg"></div>スマホで見る</div>
  </div>
  <div class="sc-right">
    <div class="sc-panel" id="scQ"><div class="inner qtext" id="scQin"></div></div>
    <div class="sc-panel sc-ansp" id="scAP"><div class="inner qtext" id="scAin"></div></div>
    <div class="sc-panel sc-altp" id="scLP"><div class="inner qtext" id="scLin"></div></div>
  </div>
  <div class="sc-hint">F キーで全画面</div>
</div>

<!-- ======================= スマホ画面 ======================= -->
<div id="mobile" class="hidden">
  <div class="m-head"><h1 id="mTitle">問題表示</h1><span class="pill" id="mConn">接続中…</span></div>
  <div id="mLatest"></div>
  <div class="m-sec" id="mHistHead"></div>
  <div id="mHist"></div>
  <div class="m-bar hidden" id="mBar"><button class="primary" id="mSend">早押しストックへ送る</button><button id="mStockSet" style="flex:0 0 auto">⚙</button></div>
</div>

<div class="toast" id="toast"></div>

function qrSvg(text){
  try{ const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); }
  catch(e){ return '<div class="small">QR作成失敗</div>'; }
}
function lookupLinks(word){
  const w = encodeURIComponent(word);
  const latin = /[A-Za-z]/.test(word);
  const links = [
    ['Google（読み方）', `https://www.google.com/search?q=${w}+${latin ? '発音' : '読み方'}`],
    ['Wikipedia', `https://ja.wikipedia.org/w/index.php?search=${w}`],
    ['Weblio', `https://www.weblio.jp/content/${w}`],
  ];
  if(latin) links.push(['英辞郎', `https://eow.alc.co.jp/search?q=${w}`], ['Forvo（発音）', `https://ja.forvo.com/search/${w}/`]);
  else links.push(['コトバンク', `https://kotobank.jp/search?q=${w}`]);
  return links;
}

/* ---------- ルビ・リンク編集 ---------- */
function offsetIn(node, off){
  const el = node.nodeType === 3 ? node.parentElement : node;
  const ann = el.closest('.ann');
  if(ann) return { ann, s: +ann.dataset.s, e: +ann.dataset.e };
  const seg = el.closest('.seg');
  if(seg) return { pos: +seg.dataset.s + (node.nodeType === 3 ? off : 0) };
  return null;
}
function charType(ch){
  if(/[\p{Script=Han}々〆ヶ]/u.test(ch)) return 'kanji';
  if(/[\p{Script=Katakana}ー･・]/u.test(ch)) return 'kata';
  if(/[A-Za-z0-9Ａ-Ｚａ-ｚ'’\-\.&]/.test(ch)) return 'latin';
  if(/[\p{Script=Hiragana}]/u.test(ch)) return 'hira';
  return 'other';
}
function expandWord(text, pos){
  if(pos >= text.length) pos = text.length - 1;
  const t = charType(text[pos]); if(t === 'other') return null;
  let s = pos, e = pos + 1;
  while(s > 0 && charType(text[s-1]) === t) s--;
  while(e < text.length && charType(text[e]) === t) e++;
  // 英語は単語の途中のピリオド等を端から除く
  while(t === 'latin' && e > s + 1 && /[\.\-']/.test(text[e-1])) e--;
  return { s, e };
}
function onTextPick(ev){
  const holder = ev.target.closest('[data-k]'); if(!holder) return;
  const k = holder.dataset.k;
  const s = store.s; const qi = s.cur; const q = s.qs[qi]; if(!q) return;
  const text = k === 'q' ? q.q : q.a;
  const sel = window.getSelection();
  let range = null;
  if(sel && !sel.isCollapsed && holder.contains(sel.anchorNode) && holder.contains(sel.focusNode)){
    const a = offsetIn(sel.anchorNode, sel.anchorOffset), b = offsetIn(sel.focusNode, sel.focusOffset);
    if(a && b){
      const pa = a.ann ? [a.s, a.e] : [a.pos, a.pos], pb = b.ann ? [b.s, b.e] : [b.pos, b.pos];
      range = { s: Math.min(pa[0], pb[0]), e: Math.max(pa[1], pb[1]) };
      if(range.e <= range.s) range = null;
    }
  }
  if(!range){
    const annEl = ev.target.closest('.ann');
    if(annEl){ range = { s: +annEl.dataset.s, e: +annEl.dataset.e }; }
    else{
      let node, off;
      if(document.caretRangeFromPoint){ const r = document.caretRangeFromPoint(ev.clientX, ev.clientY); if(r){ node = r.startContainer; off = r.startOffset; } }
      else if(document.caretPositionFromPoint){ const p = document.caretPositionFromPoint(ev.clientX, ev.clientY); if(p){ node = p.offsetNode; off = p.offset; } }
      if(!node) return;
      const o = offsetIn(node, off); if(!o || o.pos == null) return;
      // クリック位置の文字（キャレットの左右どちらか近いほう）
      let pos = o.pos;
      if(node.nodeType === 3){
        const r = document.createRange(); const len = node.length;
        if(off < len){ r.setStart(node, off); r.setEnd(node, off + 1); const rc = r.getBoundingClientRect(); if(ev.clientX < rc.left && off > 0) pos--; }
        else pos--;
      }
      range = expandWord(text, Math.max(0, pos));
    }
  }
  if(!range) return;
  sel && sel.removeAllRanges();
  openAnnEditor(qi, k, text, range);
}
function openAnnEditor(qi, k, text, range){
  const s = store.s;
  const cur = (s.ann['q' + qi] || { q:[], a:[] })[k];
  const exist = cur.find(a => a.s === range.s && a.e === range.e) || {};
  let { s: rs, e: re } = range;
  const m = modal(`<h2>ルビ・参考リンク</h2>
    <div class="field"><span class="lab">対象の文字（範囲は ◀▶ で調整）</span>
      <div style="display:flex;gap:8px;align-items:center">
        <button data-adj="s-">◀</button><button data-adj="s+">▶</button>
        <div class="target" id="annTarget" style="flex:1;margin:0;text-align:center"></div>
        <button data-adj="e-">◀</button><button data-adj="e+">▶</button>
      </div></div>
    <div class="field"><span class="lab">ルビの候補（押すと入力されます）</span><div class="quick cand" id="annCand"></div></div>
    <div class="field"><span class="lab">ルビ（読み）</span><input type="text" id="annRuby" placeholder="例：しゅんじゅん" value="${esc(exist.r || '')}"></div>
    <div class="field"><span class="lab">参考リンク（URL・任意）</span><input type="url" id="annLink" placeholder="https://..." value="${esc(exist.l || '')}"></div>
    <div class="field"><span class="lab">調べる</span><div class="quick" id="annQuick"></div></div>
    <div class="muted small">ルビは投影画面とスマホにも表示されます。リンクは操作画面とスマホで開けます。</div>
    <div class="foot">${exist.s != null ? '<button class="danger" id="annDel">削除</button>' : ''}<span class="spacer"></span><button id="annCancel">キャンセル</button><button class="primary" id="annSave">保存</button></div>`, 'sm');
  let userTyped = !!exist.r, candSeq = 0, candT = null;
  const rubyIn = m.querySelector('#annRuby');
  rubyIn.addEventListener('input', () => { userTyped = true; });
  const candBox = m.querySelector('#annCand');
  candBox.addEventListener('click', e => { const a = e.target.closest('[data-r]'); if(a){ e.preventDefault(); rubyIn.value = a.dataset.r; userTyped = true; rubyIn.focus(); } });
  const loadCands = async () => {
    const seq = ++candSeq, ss = rs, ee = re;
    const cands = [], notes = [];
    const show = () => {
      if(seq !== candSeq) return;
      const uniq = [...new Map(cands.map(c => [c.r, c])).values()];
      candBox.innerHTML = uniq.map(c => `<a href="#" data-r="${esc(c.r)}">${esc(c.r)} <span class="muted small">${c.src}</span></a>`).join('') + notes.map(n => `<span class="muted small" style="align-self:center">${n}</span>`).join('');
      if(!userTyped && uniq.length) rubyIn.value = uniq[0].r;
    };
    notes.push('候補を探しています…'); show(); notes.length = 0;
    const jobs = [];
    if(LS.get('qd:aiKey', '')) jobs.push(aiReadings(text, ss, ee).then(rs2 => { (rs2 || []).forEach(r => cands.unshift({ r, src:'AI' })); }).catch(err => { notes.push('AI候補を取得できませんでした（' + esc(err.message) + '）'); }));
    jobs.push(dictReading(text, ss, ee).then(r => { if(r) cands.push({ r, src:'辞書' }); }).catch(() => { notes.push('辞書を読み込めませんでした'); }));
    await Promise.all(jobs);
    // AI候補を先頭に並べ直す
    cands.sort((a, b) => (a.src === 'AI' ? 0 : 1) - (b.src === 'AI' ? 0 : 1));
    if(!cands.length && !notes.length) notes.push('候補が見つかりませんでした。直接入力してください');
    show();
  };
  const refresh = () => {
    const w = text.slice(rs, re);
    m.querySelector('#annTarget').textContent = w;
    m.querySelector('#annQuick').innerHTML = lookupLinks(w).map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join('');
    clearTimeout(candT); candT = setTimeout(loadCands, 250);
  };
  refresh();
  m.querySelectorAll('[data-adj]').forEach(b => b.onclick = () => {
    const a = b.dataset.adj;
    if(a === 's-' && rs > 0) rs--; if(a === 's+' && rs < re - 1) rs++;
    if(a === 'e-' && re > rs + 1) re--; if(a === 'e+' && re < text.length) re++;
    refresh();
  });
  setTimeout(() => m.querySelector('#annRuby').focus(), 50);
  const save = (remove) => {
    const r = m.querySelector('#annRuby').value.trim(), l = m.querySelector('#annLink').value.trim();
    // 新しい範囲と重なるもの・編集前のものは置き換える
    let list = cur.filter(a => !(a.s < re && a.e > rs) && !(a.s === range.s && a.e === range.e));
    if(!remove && (r || l)) list.push({ s: rs, e: re, r, l });
    list.sort((x, y) => x.s - y.s);
    store.update({ ['ann/q' + qi + '/' + k]: list });
    closeModal();
  };
  m.querySelector('#annSave').onclick = () => save(false);
  m.querySelector('#annCancel').onclick = closeModal;
  const del = m.querySelector('#annDel'); if(del) del.onclick = () => save(true);
  m.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.tagName === 'INPUT'){ e.preventDefault(); save(false); } });
}

/* ---------- モーダル ---------- */
function modal(html, size = ''){
  closeModal();
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${size}">${html}</div>`;
  bg.addEventListener('mousedown', e => { if(e.target === bg) closeModal(); });
  bg.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
  document.body.appendChild(bg);
  return bg.firstElementChild;
}
function closeModal(){ document.querySelectorAll('.modal-bg').forEach(m => m.remove()); }

/* ---------- 貼り付け ---------- */
function openPaste(){
  const s = store.s;
  const m = modal(`<h2>問題を貼り付け</h2>
    <div class="field"><span class="lab">Excel・スプレッドシートでコピーした範囲（見出し行ごと）をそのまま貼り付け</span>
      <textarea id="pText" rows="8" placeholder="例）&#10;No.	問題文	答え	別解&#10;1	〇〇は何でしょう？	××	"></textarea></div>
    <div class="field"><span class="lab">問題集の名前</span><input type="text" id="pName" value="${esc(s.meta.name)}" placeholder="例：第3回 埼玉オープン 予選"></div>
    <div id="pMap" class="hidden">
      <div class="field"><span class="lab">列の割り当て（自動で推測しています。違っていたら直してください）</span><div class="maprow" id="pMapRow"></div></div>
      <div class="field"><span class="lab" id="pCount"></span><div class="prevwrap"><table class="prev" id="pPrev"></table></div></div>
    </div>
    <label class="chk" style="margin-bottom:10px"><input type="checkbox" id="pParen" ${LS.get('qd:parenRuby', true) ? 'checked' : ''}> カッコ書きのふりがな（例：草薙剣（くさなぎのつるぎ））を消して、自動でルビにする</label>
    ${s.qs.length ? '<div class="muted small">※ 今の問題（' + s.qs.length + '問）とルビ・読了状況は置き換わります。</div>' : ''}
    <div class="foot"><button id="pCancel">キャンセル</button><button class="primary" id="pOk" disabled>この内容で反映</button></div>`);
  let info = null, map = {};
  const ta = m.querySelector('#pText');
  const colOpts = sel => '<option value="-1">（なし）</option>' + [...Array(info.ncol).keys()].map(j => `<option value="${j}" ${sel === j ? 'selected' : ''}>${esc(info.header ? (info.header[j] || `列${j+1}`) : `列${j+1}`)}${info.header ? '' : '：' + esc((info.rows[0][j] || '').slice(0, 10))}</option>`).join('');
  const build = () => { const raw = buildQuestions(info, map); return m.querySelector('#pParen').checked ? convertParenRuby(raw) : { qs: raw, ann: {} }; };
  const preview = () => {
    const { qs, ann } = build();
    const rt = (i, k) => renderText(qs[i][k], (ann['q' + i] || {})[k] || []);
    m.querySelector('#pCount').textContent = `プレビュー（${qs.length}問）`;
    m.querySelector('#pPrev').innerHTML = '<tr><th>番号</th><th>問題文</th><th>答え</th><th>別解</th><th>備考</th></tr>' +
      qs.slice(0, 30).map((x, i) => `<tr><td>${esc(x.no)}</td><td>${rt(i, 'q')}</td><td>${rt(i, 'a')}</td><td>${esc(x.alt)}</td><td>${esc(x.note)}</td></tr>`).join('');
    m.querySelector('#pOk').disabled = !qs.length;
    return qs;
  };
  const analyze = () => {
    info = analyzePaste(ta.value);
    if(!info){ m.querySelector('#pMap').classList.add('hidden'); m.querySelector('#pOk').disabled = true; return; }
    map = Object.assign({}, info.map);
    if(info.name && !m.querySelector('#pName').value) m.querySelector('#pName').value = info.name;
    m.querySelector('#pMapRow').innerHTML = FIELDS.map(f => `<label><span class="lab">${f.name}</span><select data-f="${f.k}">${colOpts(map[f.k] ?? -1)}</select></label>`).join('');
    m.querySelectorAll('#pMapRow select').forEach(sel => sel.onchange = () => { map[sel.dataset.f] = +sel.value; preview(); });
    m.querySelector('#pMap').classList.remove('hidden');
    preview();
  };
  ta.addEventListener('input', analyze);
  setTimeout(() => ta.focus(), 50);
  m.querySelector('#pCancel').onclick = closeModal;
  m.querySelector('#pParen').onchange = e => { LS.set('qd:parenRuby', e.target.checked); if(info) preview(); };
  m.querySelector('#pOk').onclick = () => {
    const { qs, ann } = build();
    store.update({ qs, 'meta/name': m.querySelector('#pName').value.trim(), cur: 0, shown: -1, hist: [], ann, showAns: false });
    closeModal(); toast(qs.length + '問を反映しました');
  };
}

function openSettings(){
  const s = store.s, d = s.disp;
  const fb = getFbConfig();
  const m = modal(`<h2>設定</h2>
    <div class="grid2">
      <div>
        <div class="field"><span class="lab">投影画面</span>
          <label class="chk"><input type="checkbox" id="sQr" ${d.qr ? 'checked' : ''}> スマホ用QRコードを表示</label>
          <label class="chk"><input type="checkbox" id="sRuby" ${d.ruby ? 'checked' : ''}> ルビを表示</label>
          <label class="chk"><input type="checkbox" id="sLight" ${d.theme === 'light' ? 'checked' : ''}> 白背景にする（通常は黒）</label>
        </div>
        <div class="field"><span class="lab">操作画面</span><label class="chk"><input type="checkbox" id="sDark" ${document.body.classList.contains('dark') ? 'checked' : ''}> ダークモード</label></div>
        <div class="field"><span class="lab">操作画面の文字の大きさ</span><input type="range" id="sOpSize" min="18" max="48" value="${LS.get('qd:opsize', 30)}" style="width:100%"></div>
        <div class="field"><span class="lab">ルーム</span>
          <div style="display:flex;gap:8px"><input type="text" id="sRoom" value="${esc(store.room)}" style="text-transform:uppercase"><button id="sRoomGo">移動</button><button id="sRoomNew">新規</button></div>
          <div class="muted small" style="margin-top:4px">ルームごとに問題・ルビ・進行状況が保存されます。</div></div>
      </div>
      <div>
        <div class="field"><span class="lab">AI のルビ候補（任意）</span>
          <input type="text" id="sAiKey" value="${esc(LS.get('qd:aiKey', ''))}" placeholder="Claude API キー（sk-ant-…）" autocomplete="off" spellcheck="false">
          <div class="muted small" style="margin-top:4px">入れると、クリックした語の読みを AI が文脈から提案します（Anthropic の API 利用料がかかります）。空欄なら辞書の候補だけを出します。キーはこのPCにだけ保存されます。</div></div>
        <div class="field"><span class="lab">Firebase（スマホ連携）${store.mode === 'firebase' ? ' <span class="pill on">接続済み</span>' : ''}</span>
          <textarea id="sFb" rows="5" placeholder="Firebase コンソールの firebaseConfig = { ... } をそのまま貼り付け" ${FIREBASE_CONFIG ? 'disabled' : ''}>${FIREBASE_CONFIG ? 'ファイル内で設定済み' : (fb ? esc(JSON.stringify(fb, null, 1)) : '')}</textarea>
          <div class="muted small" style="margin-top:4px">この端末に保存され、スマホへはQRのURLで受け渡されます。</div></div>
      </div>
    </div>
    <div class="foot"><button id="sCancel">閉じる</button><button class="primary" id="sSave">保存</button></div>`);
  m.querySelector('#sOpSize').oninput = e => { document.documentElement.style.setProperty('--opsize', e.target.value + 'px'); LS.set('qd:opsize', +e.target.value); };
  const goRoom = r => { closeModal(); location.href = baseUrl() + '?room=' + r; };
  m.querySelector('#sRoomGo').onclick = () => { const r = m.querySelector('#sRoom').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, ''); if(r) goRoom(r); };
  m.querySelector('#sRoomNew').onclick = () => goRoom(randRoom());
  m.querySelector('#sDark').onchange = e => setOpDark(e.target.checked);
  m.querySelector('#sCancel').onclick = closeModal;
  m.querySelector('#sSave').onclick = () => {
    LS.set('qd:aiKey', m.querySelector('#sAiKey').value.trim());
    store.update({ 'disp/qr': m.querySelector('#sQr').checked, 'disp/ruby': m.querySelector('#sRuby').checked,
      'disp/theme': m.querySelector('#sLight').checked ? 'light' : 'dark' });
    if(!FIREBASE_CONFIG){
      const t = m.querySelector('#sFb').value.trim();
      const old = JSON.stringify(getFbConfig());
      if(!t){ if(old !== 'null'){ localStorage.removeItem('qd:fb'); toast('Firebase 設定を消しました。再読み込みします'); setTimeout(() => location.reload(), 800); } }
      else{
        const c = parseFbConfig(t);
        if(!c || !c.projectId){ toast('Firebase 設定を読み取れません（projectId が必要です）'); return; }
        if(JSON.stringify(c) !== old){ LS.set('qd:fb', c); toast('Firebase に接続します…'); setTimeout(() => location.reload(), 800); }
      }
    }
    closeModal();
  };
}

/* =====================================================================
   投影画面
   ===================================================================== */
async function initScreen(){
  $('#screen').classList.remove('hidden');
  const room = (params.get('room') || '').toUpperCase();
  store = new Store(room);
  store.on(renderScreen);
  await store.connect();
  document.title = '投影｜問題表示';
  document.addEventListener('keydown', e => { if(e.key === 'f' || e.key === 'F'){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } });
  window.addEventListener('resize', fitScreen);
}
function renderScreen(s){
  const d = s.disp;
  $('#screen').classList.toggle('light', d.theme === 'light');
  $('#scSet').textContent = s.meta.name || '';
  const q = s.qs[s.shown];
  const an = s.ann['q' + s.shown] || { q:[], a:[] };
  if(q){
    $('#scNo').textContent = q.no;
    $('#scQin').innerHTML = renderText(q.q, an.q, { ruby: d.ruby });
    $('#scAin').innerHTML = s.showAns ? `<span class="lab num-font">Ans.</span>${renderText(q.a, an.a, { ruby: d.ruby })}` : '';
    $('#scLin').innerHTML = s.showAns && q.alt ? esc(altLines(q.alt)) : '';
  }else{
    $('#scNo').textContent = '';
    $('#scQin').innerHTML = s.qs.length ? '' : '<span class="sc-wait">ルーム ' + esc(store.room) + '</span>';
    $('#scAin').innerHTML = ''; $('#scLin').innerHTML = '';
  }
  const qrOn = d.qr && store.mode === 'firebase';
  $('#scQr').classList.toggle('hidden', !qrOn);
  if(qrOn && !$('#scQrSvg').dataset.done){ $('#scQrSvg').innerHTML = qrSvg(viewUrl('m', store.room, true)); $('#scQrSvg').dataset.done = 1; }
  fitScreen();
}
// 別解：行ごとに「○：」を付ける（すでに ○△× などで始まる行はそのまま）
function altLines(alt){
  return String(alt).split(/\n/).map(x => x.trim()).filter(Boolean).map(x => /^[○〇◯△×✕□]/.test(x) ? x : '〇：' + x).join('\n');
}
function fitOne(box, inner, minVh, maxVh){
  if(!box || !inner) return;
  const vh = window.innerHeight / 100;
  let lo = minVh * vh, hi = maxVh * vh;
  inner.style.fontSize = hi + 'px';
  if(inner.scrollHeight <= box.clientHeight) return;
  for(let i = 0; i < 12; i++){ const mid = (lo + hi) / 2; inner.style.fontSize = mid + 'px'; if(inner.scrollHeight <= box.clientHeight) lo = mid; else hi = mid; }
  inner.style.fontSize = lo + 'px';
}
function fitScreen(){
  fitOne($('#scQ'), $('#scQin'), 2.4, 5.6);
  fitOne($('#scAP'), $('#scAin'), 2.6, 6.4);
  fitOne($('#scLP'), $('#scLin'), 2, 3.9);
  const no = $('#scNo'); if(no){ no.style.fontSize = ''; const w = no.parentElement.clientWidth * 0.94; let f = 14; while(no.scrollWidth > w && f > 5){ f -= .5; no.style.fontSize = f + 'vh'; } }
}

/* =====================================================================
   スマホ画面（みんな用 / 自分用）
   ===================================================================== */
let IS_ME = false;
async function initMobile(me){
  IS_ME = me;
  $('#mobile').classList.remove('hidden');
  document.body.style.background = 'var(--bg)';
  const room = (params.get('room') || '').toUpperCase();
  // 設定情報(fb)をURLから消しておく（ブックマークしやすくするため。設定は端末に保存済み）
  if(params.get('fb')) history.replaceState(null, '', viewUrl(me ? 'me' : 'm', room, false));
  store = new Store(room);
  store.on(renderMobile);
  await store.connect();
  document.title = (me ? '自分用｜' : '') + '問題表示';
  if(me){ $('#mBar').classList.remove('hidden'); $('#mStockSet').onclick = openStockSetting; $('#mSend').onclick = sendQueue; }
  $('#mobile').addEventListener('click', e => {
    const b = e.target.closest('[data-save]'); if(b) toggleSave(+b.dataset.save);
  });
}
function mCard(s, i, latest){
  const q = s.qs[i]; if(!q) return '';
  const an = s.ann['q' + i] || { q:[], a:[] };
  const showA = !latest || s.showAns;
  const key = IS_ME ? stockKey(s, i) : '';
  const queued = IS_ME && stockQueue().some(x => x.k === key), sent = IS_ME && savedSet().has(key);
  return `<div class="m-card ${latest ? 'latest' : ''}">
    <div class="top"><span class="no">第${esc(q.no)}問</span>${latest ? '<span class="tag">いま読んだ問題</span>' : ''}</div>
    <div class="q qtext">${renderText(q.q, an.q, { links:true, linkMark:true })}</div>
    ${showA ? `<div class="a"><span class="k">答</span>${renderText(q.a, an.a, { links:true, linkMark:true })}</div>${q.alt ? `<div class="alt">別解：${esc(q.alt)}</div>` : ''}${IS_ME && q.note ? `<div class="note">${esc(q.note)}</div>` : ''}` : '<div class="a muted small">（答えはまだ表示されていません）</div>'}
    ${IS_ME ? `<div class="save"><button data-save="${i}" class="${queued || sent ? 'done' : ''}">${sent ? '✓ ストックに送信済み' : queued ? '✓ 保存リストに入れました' : '早押しストックに保存'}</button></div>` : ''}
  </div>`;
}
function renderMobile(s){
  const st = store.status();
  $('#mConn').textContent = st === 'online' ? '接続中' : st === 'offline' ? 'オフライン' : '未接続';
  $('#mConn').className = 'pill ' + (st === 'online' ? 'on' : 'off');
  $('#mTitle').textContent = (IS_ME ? '【自分用】' : '') + (s.meta.name || '問題表示');
  $('#mLatest').innerHTML = s.qs[s.shown] ? mCard(s, s.shown, true) : '<div class="m-card muted">まだ問題が読まれていません。</div>';
  const hist = s.hist.filter(i => i !== s.shown).slice().reverse();
  $('#mHistHead').textContent = hist.length ? `これまでの問題（${hist.length}問）` : '';
  $('#mHist').innerHTML = hist.map(i => mCard(s, i, false)).join('');
  if(IS_ME){ const n = stockQueue().length; $('#mSend').textContent = n ? `早押しストックへ送る（${n}問）` : '早押しストックへ送る'; $('#mSend').disabled = !n; }
}

/* ---------- ④ 早押しストックへの保存 ---------- */
function stockKey(s, i){ const q = s.qs[i]; return (s.meta.name || '') + '|' + q.no + '|' + q.q.slice(0, 30); }
function savedSet(){ return new Set(LS.get('qd:saved', [])); }
function markSaved(key){ const a = LS.get('qd:saved', []); if(!a.includes(key)){ a.push(key); LS.set('qd:saved', a.slice(-3000)); } }
function stockUrl(){ return LS.get('qd:stockUrl', '') || STOCK_URL; }
function stockQueue(){ return LS.get('qd:stockQueue', []); }
function stockItem(s, i){
  const q = s.qs[i];
  return { k: stockKey(s, i), q: q.q, a: q.a, alt: q.alt || '', note: q.note || '', no: q.no, set: s.meta.name || '' };
}
// 保存ボタン：まずこのスマホの「保存リスト」に入れる（もう一度押すと取り消し）
function toggleSave(i){
  const s = store.s; if(!s.qs[i]) return;
  const it = stockItem(s, i);
  if(savedSet().has(it.k)){ toast('この問題は送信済みです'); return; }
  let qu = stockQueue();
  const has = qu.some(x => x.k === it.k);
  qu = has ? qu.filter(x => x.k !== it.k) : qu.concat([it]);
  LS.set('qd:stockQueue', qu);
  renderMobile(store.s);
  toast(has ? '保存を取り消しました' : '保存リストに入れました（' + qu.length + '問）');
}
// 保存リストをコードにしてコピー → 早押しストックの「取り込み」に貼り付け
async function sendQueue(){
  const qu = stockQueue(); if(!qu.length) return;
  const code = 'HSTOCK1:' + b64u(JSON.stringify(qu.map(({ k, ...x }) => x)));
  let copied = false;
  try{ await navigator.clipboard.writeText(code); copied = true; }catch(e){}
  const url = stockUrl() + '#import';
  const m = modal(`<h2>早押しストックへ送る（${qu.length}問）</h2>
    <p style="line-height:1.8;margin-top:0">${copied ? '✓ コードをコピーしました。' : 'コードを長押しで全選択してコピーしてください。'}<br>
    ① 下のボタンで早押しストックを開く<br>② 「取り込み」の欄に貼り付けて「追加」</p>
    <textarea readonly rows="3" id="sqCode" style="font-size:12px">${esc(code)}</textarea>
    <div class="foot" style="flex-direction:column;align-items:stretch">
      <a class="btnlink" href="${esc(url)}" target="_blank" rel="noopener">早押しストックを開く</a>
      <button id="sqCopy">コードをもう一度コピー</button>
      <button id="sqDone">追加できた（保存リストを空にする）</button>
      <button class="ghost" id="sqClose">閉じる</button>
    </div>
    <p class="muted small">「復習：${esc(store.s.meta.name || '無題')}」タグ付きの問題として追加されます。</p>`, 'sm');
  m.querySelector('#sqCode').onclick = e => e.target.select();
  m.querySelector('#sqCopy').onclick = () => navigator.clipboard.writeText(code).then(() => toast('コピーしました'), () => { m.querySelector('#sqCode').select(); });
  m.querySelector('#sqClose').onclick = closeModal;
  m.querySelector('#sqDone').onclick = () => { qu.forEach(x => markSaved(x.k)); LS.set('qd:stockQueue', []); closeModal(); renderMobile(store.s); toast('送信済みにしました'); };
}
function openStockSetting(){
  const m = modal(`<h2>保存先の設定</h2>
    <div class="field"><span class="lab">早押しストックのURL</span><input type="url" id="stUrl" value="${esc(stockUrl())}" placeholder="https://..."></div>
    <div class="muted small">ふだんは変更不要です。空欄にすると最初の設定に戻ります。</div>
    <div class="foot"><button id="stCancel">閉じる</button><button class="primary" id="stOk">保存</button></div>`, 'sm');
  m.querySelector('#stCancel').onclick = closeModal;
  m.querySelector('#stOk').onclick = () => { LS.set('qd:stockUrl', m.querySelector('#stUrl').value.trim()); closeModal(); toast('保存しました'); };
}

document.documentElement.style.setProperty('--opsize', LS.get('qd:opsize', 30) + 'px');
(async function main(){
  if(VIEW === 'screen') await initScreen();
  else if(VIEW === 'm' || VIEW === 'me') await initMobile(VIEW === 'me');
  else await initOp();
})();
</script>
